<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>AI Resume Analyzer</h1>

        <p class="subtitle">
            Upload your resume and get an instant analysis.
        </p>

        <div class="upload-card">

            <h2>Upload Your Resume</h2>

            <form action="/analyze"
                  method="POST"
                  enctype="multipart/form-data">

                <input type="file"
                       name="resume"
                       accept=".pdf,.docx"
                       required>

                <br><br>

                <button type="submit">
                    Analyze Resume
                </button>

            </form>

        </div>

    </div>

</body>
</html>
